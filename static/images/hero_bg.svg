<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="35%" stop-color="#141414"/>
      <stop offset="70%" stop-color="#1c0709"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="hero-glow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#831010" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0f3460" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#hero-grad)"/>
  <rect width="1600" height="600" fill="url(#hero-glow)"/>
  <rect width="1600" height="600" fill="url(#blue-glow)"/>
  
  <!-- Subtle decorative film strip perforations in background -->
  <g opacity="0.06" fill="#ffffff">
    <rect x="0" y="20" width="1600" height="4"/>
    <rect x="0" y="60" width="1600" height="4"/>
    <!-- Sprocket holes -->
    <rect x="20" y="30" width="30" height="20" rx="3"/>
    <rect x="80" y="30" width="30" height="20" rx="3"/>
    <rect x="140" y="30" width="30" height="20" rx="3"/>
    <rect x="200" y="30" width="30" height="20" rx="3"/>
    <rect x="260" y="30" width="30" height="20" rx="3"/>
    <rect x="320" y="30" width="30" height="20" rx="3"/>
    <rect x="380" y="30" width="30" height="20" rx="3"/>
    <rect x="440" y="30" width="30" height="20" rx="3"/>
    <rect x="500" y="30" width="30" height="20" rx="3"/>
    <rect x="560" y="30" width="30" height="20" rx="3"/>
    <rect x="620" y="30" width="30" height="20" rx="3"/>
    <rect x="680" y="30" width="30" height="20" rx="3"/>
    <rect x="740" y="30" width="30" height="20" rx="3"/>
    <rect x="800" y="30" width="30" height="20" rx="3"/>
    <rect x="860" y="30" width="30" height="20" rx="3"/>
    <rect x="920" y="30" width="30" height="20" rx="3"/>
    <rect x="980" y="30" width="30" height="20" rx="3"/>
    <rect x="1040" y="30" width="30" height="20" rx="3"/>
    <rect x="1100" y="30" width="30" height="20" rx="3"/>
    <rect x="1160" y="30" width="30" height="20" rx="3"/>
    <rect x="1220" y="30" width="30" height="20" rx="3"/>
    <rect x="1280" y="30" width="30" height="20" rx="3"/>
    <rect x="1340" y="30" width="30" height="20" rx="3"/>
    <rect x="1400" y="30" width="30" height="20" rx="3"/>
    <rect x="1460" y="30" width="30" height="20" rx="3"/>
    <rect x="1520" y="30" width="30" height="20" rx="3"/>
  </g>

  <!-- Giant cinematic abstract spotlight triangles -->
  <polygon points="1200,0 1600,0 1600,600 1000,600" fill="#e50914" opacity="0.04"/>
  <polygon points="1400,0 1600,0 1600,400 1300,600" fill="#e50914" opacity="0.05"/>
</svg>
