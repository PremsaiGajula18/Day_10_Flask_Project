<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-def" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#2c1114"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg-def)" />
  
  <!-- Movie clapperboard icon -->
  <g transform="translate(130, 180)">
    <rect x="0" y="30" width="140" height="100" rx="8" fill="#222" stroke="#444" stroke-width="2"/>
    <!-- Clapper top bar -->
    <path d="M-5 10 L145 0 L145 25 L-5 35 Z" fill="#e50914"/>
    <!-- Stripes -->
    <polygon points="10,8 25,6 18,33 3,35" fill="#fff"/>
    <polygon points="50,4 65,3 58,30 43,32" fill="#fff"/>
    <polygon points="90,1 105,0 98,27 83,29" fill="#fff"/>
    <polygon points="130,-2 145,-3 138,24 123,26" fill="#fff"/>
    <!-- Play triangle -->
    <polygon points="55,60 55,100 95,80" fill="#e50914"/>
  </g>

  <rect x="30" y="30" width="100" height="26" rx="4" fill="#e50914"/>
  <text x="80" y="48" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1.5">MOVIE NIGHT</text>
  
  <text x="200" y="470" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1.5">STREAM &amp; VOTE</text>
  <text x="200" y="505" fill="#e50914" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">CURATED SELECTION</text>
  <text x="200" y="540" fill="#777" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">JOIN THE AUDIENCE</text>
</svg>
