{% extends "base.html" %}

{% block title %}Create Movie Night{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card" style="max-width: 680px;">
    <div class="form-header">
      <h1 class="form-title">Host a Movie Night</h1>
      <p class="form-subtitle">Set up the event details, pick a category, and invite everyone to vote.</p>
    </div>

    <form action="{{ url_for('create_night') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="title" class="form-label">Movie Night Title <span class="required">*</span></label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          class="form-control" 
          placeholder="e.g. 80s Cyberpunk Marathon or Cozy Autumn Cinema" 
          value="{{ request.form.get('title', '') }}" 
          required 
          maxlength="100"
          autofocus
        >
        <div class="form-hint">Give your movie night a catchy, cinematic title.</div>
      </div>

      <div class="form-group">
        <label for="date" class="form-label">Event Date <span class="required">*</span></label>
        <input 
          type="date" 
          id="date" 
          name="date" 
          class="form-control" 
          value="{{ request.form.get('date', '') }}" 
          required
        >
      </div>

      <div class="form-group">
        <label for="category" class="form-label">Category / Genre <span class="required">*</span></label>
        <select id="category" name="category" class="form-control" required>
          <option value="" disabled {% if not request.form.get('category') %}selected{% endif %}>-- Select a category --</option>
          <option value="Action" {% if request.form.get('category') == 'Action' %}selected{% endif %}>Action</option>
          <option value="Comedy" {% if request.form.get('category') == 'Comedy' %}selected{% endif %}>Comedy</option>
          <option value="Animation" {% if request.form.get('category') == 'Animation' %}selected{% endif %}>Animation</option>
          <option value="Other" {% if request.form.get('category') == 'Other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Short Description / Vibe <span class="required">*</span></label>
        <textarea 
          id="description" 
          name="description" 
          class="form-control" 
          rows="4" 
          placeholder="Describe the mood, snacks, timeline, or theme of the evening..." 
          required 
          maxlength="1000"
        >{{ request.form.get('description', '') }}</textarea>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <a href="{{ url_for('index') }}" class="btn btn-outline" style="flex: 1;">Cancel</a>
        <button type="submit" class="btn btn-primary" style="flex: 2;">
          🎬 Publish Movie Night
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
