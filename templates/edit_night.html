{% extends "base.html" %}

{% block title %}Edit {{ night.title }}{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card" style="max-width: 680px;">
    <div class="form-header">
      <h1 class="form-title">Edit Movie Night</h1>
      <p class="form-subtitle">Update the details for "{{ night.title }}"</p>
    </div>

    <form action="{{ url_for('edit_night', night_id=night.id) }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="title" class="form-label">Movie Night Title <span class="required">*</span></label>
        <input 
          type="text" 
          id="title" 
          name="title" 
          class="form-control" 
          value="{{ request.form.get('title', night.title) }}" 
          required 
          maxlength="100"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="date" class="form-label">Event Date <span class="required">*</span></label>
        <input 
          type="date" 
          id="date" 
          name="date" 
          class="form-control" 
          value="{{ request.form.get('date', night.date) }}" 
          required
        >
      </div>

      <div class="form-group">
        <label for="category" class="form-label">Category / Genre <span class="required">*</span></label>
        {% set current_cat = request.form.get('category', night.category) %}
        <select id="category" name="category" class="form-control" required>
          <option value="Action" {% if current_cat == 'Action' %}selected{% endif %}>Action</option>
          <option value="Comedy" {% if current_cat == 'Comedy' %}selected{% endif %}>Comedy</option>
          <option value="Animation" {% if current_cat == 'Animation' %}selected{% endif %}>Animation</option>
          <option value="Other" {% if current_cat == 'Other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description" class="form-label">Short Description / Vibe <span class="required">*</span></label>
        <textarea 
          id="description" 
          name="description" 
          class="form-control" 
          rows="4" 
          required 
          maxlength="1000"
        >{{ request.form.get('description', night.description) }}</textarea>
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <a href="{{ url_for('detail', night_id=night.id) }}" class="btn btn-outline" style="flex: 1;">Cancel</a>
        <button type="submit" class="btn btn-primary" style="flex: 2;">
          💾 Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
