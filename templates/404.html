{% extends "base.html" %}

{% block title %}404 - Not Found{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 6rem 1rem;">
  <div style="font-size: 5rem; margin-bottom: 1rem; color: var(--netflix-red);">🎬 404</div>
  <h1 style="margin-bottom: 1rem; font-size: 2.2rem;">Movie Night Not Found</h1>
  <p style="margin-bottom: 2rem; color: var(--text-secondary); max-width: 500px; margin-left: auto; margin-right: auto;">
    The cinematic experience or page you are looking for does not exist or has been removed.
  </p>
  <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">&larr; Return to Browse</a>
</div>
{% endblock %}
