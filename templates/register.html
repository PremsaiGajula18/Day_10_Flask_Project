{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card">
    <div class="form-header">
      <h1 class="form-title">Join Movie Night</h1>
      <p class="form-subtitle">Create an account to host movie nights and vote on films.</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="name" class="form-label">Full Name <span class="required">*</span></label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-control" 
          placeholder="e.g. Alex Rivera" 
          value="{{ request.form.get('name', '') }}" 
          required 
          maxlength="80"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="username" class="form-label">Username <span class="required">*</span></label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          placeholder="e.g. alexrivera" 
          value="{{ request.form.get('username', '') }}" 
          required 
          maxlength="40"
        >
        <div class="form-hint">Must be unique. Letters, numbers, and underscores recommended.</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password <span class="required">*</span></label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="At least 6 characters" 
          required 
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label for="password_confirm" class="form-label">Confirm Password <span class="required">*</span></label>
        <input 
          type="password" 
          id="password_confirm" 
          name="password_confirm" 
          class="form-control" 
          placeholder="Re-type your password" 
          required 
          minlength="6"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
        Create Account
      </button>

      <div class="form-footer">
        Already have an account? <a href="{{ url_for('login') }}">Sign In here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
